<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How Verdict works</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#231c33"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8597"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="24" fill="#efeee9"/>

  <!-- Title -->
  <text x="48" y="64" font-size="30" font-weight="800" fill="#231c33">How a trial runs</text>
  <text x="48" y="94" font-size="16" fill="#5d5868">From a new product to a keep-or-return verdict, before the store's return window closes.</text>

  <!-- Stage cards -->
  <g font-size="14" fill="#231c33">
    <!-- 1 -->
    <rect x="48" y="128" width="200" height="176" rx="18" fill="#fbfbf9" stroke="#d9d7d0"/>
    <circle cx="76" cy="158" r="14" fill="#231c33"/><text x="76" y="163" text-anchor="middle" fill="#fbfbf9" font-weight="700" font-size="14">1</text>
    <text x="64" y="200" font-size="17" font-weight="700">Paste the label</text>
    <text x="64" y="226" fill="#5d5868">Ingredient list, price,</text>
    <text x="64" y="246" fill="#5d5868">store and return</text>
    <text x="64" y="266" fill="#5d5868">deadline.</text>

    <!-- 2 -->
    <rect x="280" y="128" width="200" height="176" rx="18" fill="#ece8fb" stroke="#cfc6f2"/>
    <circle cx="308" cy="158" r="14" fill="#5a43c9"/><text x="308" y="163" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">2</text>
    <text x="296" y="200" font-size="17" font-weight="700">Agent designs it</text>
    <text x="296" y="226" fill="#4a4060">Which metrics move,</text>
    <text x="296" y="246" fill="#4a4060">from which day; purge</text>
    <text x="296" y="266" fill="#4a4060">windows, clashes, a</text>
    <text x="296" y="286" fill="#4a4060">checkpoint if needed.</text>

    <!-- 3 -->
    <rect x="512" y="128" width="200" height="176" rx="18" fill="#fbfbf9" stroke="#d9d7d0"/>
    <circle cx="540" cy="158" r="14" fill="#231c33"/><text x="540" y="163" text-anchor="middle" fill="#fbfbf9" font-weight="700" font-size="14">3</text>
    <text x="528" y="200" font-size="17" font-weight="700">Two baselines</text>
    <text x="528" y="226" fill="#5d5868">Scanned a minute</text>
    <text x="528" y="246" fill="#5d5868">apart. How much they</text>
    <text x="528" y="266" fill="#5d5868">disagree = your noise</text>
    <text x="528" y="286" fill="#5d5868">floor.</text>

    <!-- 4 -->
    <rect x="744" y="128" width="200" height="176" rx="18" fill="#fbfbf9" stroke="#d9d7d0"/>
    <circle cx="772" cy="158" r="14" fill="#231c33"/><text x="772" y="163" text-anchor="middle" fill="#fbfbf9" font-weight="700" font-size="14">4</text>
    <text x="760" y="200" font-size="17" font-weight="700">Scan on schedule</text>
    <text x="760" y="226" fill="#5d5868">Ghost overlay + light</text>
    <text x="760" y="246" fill="#5d5868">checks on the phone,</text>
    <text x="760" y="266" fill="#5d5868">then YouCam scores</text>
    <text x="760" y="286" fill="#5d5868">12 concerns.</text>

    <!-- 5 -->
    <rect x="976" y="128" width="176" height="176" rx="18" fill="#231c33"/>
    <circle cx="1004" cy="158" r="14" fill="#fbfbf9"/><text x="1004" y="163" text-anchor="middle" fill="#231c33" font-weight="700" font-size="14">5</text>
    <text x="992" y="200" font-size="17" font-weight="700" fill="#fbfbf9">Verdict</text>
    <rect x="992" y="216" width="68" height="26" rx="13" fill="#12866a"/><text x="1026" y="234" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">Keep</text>
    <rect x="1066" y="216" width="70" height="26" rx="13" fill="#d0472d"/><text x="1101" y="234" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">Ditch</text>
    <rect x="992" y="250" width="84" height="26" rx="13" fill="#c8891a"/><text x="1034" y="268" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">Not yet</text>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#231c33" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 216 H276"/>
    <path d="M482 216 H508"/>
    <path d="M714 216 H740"/>
    <path d="M946 216 H972"/>
  </g>
  <!-- Repeat loop on stage 4 -->
  <path d="M800 306 C800 340, 888 340, 888 306" stroke="#8a8597" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#arrowSoft)"/>
  <text x="844" y="352" text-anchor="middle" font-size="13" fill="#5d5868">about weekly</text>

  <!-- Lower panels -->
  <!-- YouCam API -->
  <rect x="48" y="384" width="540" height="236" rx="18" fill="#fbfbf9" stroke="#d9d7d0"/>
  <text x="72" y="420" font-size="18" font-weight="800" fill="#231c33">Each scan: YouCam Skin Analysis API v2</text>
  <g font-size="14" fill="#231c33">
    <rect x="72" y="440" width="492" height="34" rx="10" fill="#efeee9"/>
    <text x="88" y="462"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">POST /s2s/v2.0/file</tspan><tspan fill="#5d5868">  register image, get pre-signed URL</tspan></text>
    <rect x="72" y="480" width="492" height="34" rx="10" fill="#efeee9"/>
    <text x="88" y="502"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">PUT  &lt;pre-signed URL&gt;</tspan><tspan fill="#5d5868">  upload the bytes</tspan></text>
    <rect x="72" y="520" width="492" height="34" rx="10" fill="#efeee9"/>
    <text x="88" y="542"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">POST /task/skin-analysis</tspan><tspan fill="#5d5868">  12 concerns, HD or SD, masks</tspan></text>
    <rect x="72" y="560" width="492" height="34" rx="10" fill="#efeee9"/>
    <text x="88" y="582"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">GET  /task/skin-analysis/{id}</tspan><tspan fill="#5d5868">  poll → raw_score, skin age</tspan></text>
  </g>

  <!-- Verdict engine with mini chart -->
  <rect x="612" y="384" width="540" height="236" rx="18" fill="#fbfbf9" stroke="#d9d7d0"/>
  <text x="636" y="420" font-size="18" font-weight="800" fill="#231c33">Verdict engine: does it clear the noise?</text>
  <!-- chart area -->
  <g>
    <rect x="652" y="486" width="460" height="56" fill="#dedcd4" opacity="0.7"/>
    <line x1="652" y1="514" x2="1112" y2="514" stroke="#8a8597" stroke-dasharray="4 4"/>
    <line x1="652" y1="582" x2="1112" y2="582" stroke="#c9c6bd"/>
    <!-- onset -->
    <line x1="902" y1="440" x2="902" y2="582" stroke="#5a43c9" stroke-dasharray="3 4"/>
    <text x="908" y="452" font-size="12" fill="#5a43c9">onset day</text>
    <!-- line -->
    <polyline points="660,518 700,510 760,506 820,512 880,500 940,476 990,462 1040,452" fill="none" stroke="#12866a" stroke-width="3"/>
    <g fill="#12866a">
      <circle cx="660" cy="518" r="5"/><circle cx="700" cy="510" r="5"/><circle cx="760" cy="506" r="5"/>
      <circle cx="880" cy="500" r="5"/><circle cx="940" cy="476" r="5"/><circle cx="990" cy="462" r="5"/><circle cx="1040" cy="452" r="5"/>
    </g>
    <circle cx="820" cy="512" r="5" fill="#fbfbf9" stroke="#8a8597" stroke-width="2"/>
    <text x="1094" y="530" text-anchor="end" font-size="12" fill="#5d5868">noise band (±2×)</text>
    <line x1="820" y1="519" x2="820" y2="556" stroke="#8a8597"/>
    <text x="820" y="571" text-anchor="middle" font-size="12" fill="#5d5868">dim scan, set aside</text>
    <text x="1040" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#12866a">real change</text>
  </g>
</svg>
